<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .signup-container {
            background-color: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .error-message {
            color: red;
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }
        .is-invalid {
            border-color: red !important;
        }
        /* Your existing styles... */
    </style>
</head>
<body>
<div class="signup-container">
    <h2>Signup</h2>
    <form id="signupForm" th:action="@{/signup}" method="post" th:object="${user}" autocomplete="off">
        <!-- Name Field -->
        <div class="form-group">
            <p th:if="${error}" th:text="${error}" style="color: red;"></p>
            <label>Name:</label>
            <input type="text" th:field="*{name}" id="name"
                   class="form-control"
                   oninput="validateName()"
                   pattern="^[a-zA-Z ]+$"
                   title="Only letters and spaces allowed">
            <div id="nameError" class="error-message"></div>
            <div th:if="${#fields.hasErrors('name')}" class="error-message">
                <span th:errors="*{name}"></span>
            </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" id="email"
                   class="form-control"
                   oninput="validateEmail()"
                   pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
                   title="Only @gmail.com emails allowed">
            <div id="emailError" class="error-message"></div>
            <div th:if="${#fields.hasErrors('email')}" class="error-message">
                <span th:errors="*{email}"></span>
            </div>
        </div>

        <!-- Contact Field -->
        <div class="form-group">
            <label>Contact:</label>
            <input type="text" th:field="*{contact}" id="contact"
                   class="form-control"
                   oninput="validateContact()"
                   pattern="^\d{10}$"
                   title="Exactly 10 digits required">
            <div id="contactError" class="error-message"></div>
            <div th:if="${#fields.hasErrors('contact')}" class="error-message">
                <span th:errors="*{contact}"></span>
            </div>
        </div>

        <!-- Rest of your form fields... -->
        <div>
            <label>Date of Birth:</label>
            <input type="date" th:field="*{dob}" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box;">
        </div>
        <br>

        <div>
            <label>Select role:</label>
            <select th:field="*{role}" required>
                <option value="">--Select--</option>
                <option value="Admin">Admin</option>
                <option value="Student">Student</option>
            </select>
        </div>
        <br>

        <!-- Correct Password Field -->
        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" class="form-control" required>
            <div th:if="${#fields.hasErrors('password')}" class="error-message">
                <span th:errors="*{password}"></span>
            </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="error-message">
                <span th:errors="*{confirmPassword}"></span>
            </div>
        </div>
        <br>

        <button type="submit" id="submitBtn">Sign Up</button>
    </form>
    <br>
    <p class="login-link">Already have an account? <a th:href="@{/login}">Login</a></p>

</div>

<script>
    // Real-time validation functions
    function validateName() {
        const name = document.getElementById("name").value;
        const errorElement = document.getElementById("nameError");

        if (!/^[a-zA-Z ]+$/.test(name)) {
            errorElement.textContent = "Only letters and spaces allowed";
            document.getElementById("name").classList.add("is-invalid");
            return false;
        } else {
            errorElement.textContent = "";
            document.getElementById("name").classList.remove("is-invalid");
            return true;
        }
    }

    function validateEmail() {
        const email = document.getElementById("email").value;
        const errorElement = document.getElementById("emailError");

        if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email)) {
            errorElement.textContent = "Only @gmail.com emails allowed";
            document.getElementById("email").classList.add("is-invalid");
            return false;
        } else {
            errorElement.textContent = "";
            document.getElementById("email").classList.remove("is-invalid");
            return true;
        }
    }

    function validateContact() {
        const contact = document.getElementById("contact").value;
        const errorElement = document.getElementById("contactError");

        if (!/^\d{10}$/.test(contact)) {
            errorElement.textContent = "Exactly 10 digits required";
            document.getElementById("contact").classList.add("is-invalid");
            return false;
        } else {
            errorElement.textContent = "";
            document.getElementById("contact").classList.remove("is-invalid");
            return true;
        }
    }

    // Form submission validation
    document.getElementById("signupForm").addEventListener("submit", function(event) {
        const isNameValid = validateName();
        const isEmailValid = validateEmail();
        const isContactValid = validateContact();

        if (!isNameValid || !isEmailValid || !isContactValid) {
            event.preventDefault();
            alert("Please fix the errors before submitting!");
        }
    });

<!--    // Optional: Disable submit button until valid-->
<!--    function checkFormValidity() {-->
<!--        const submitBtn = document.getElementById("submitBtn");-->
<!--        submitBtn.disabled = !(validateName() && validateEmail() && validateContact());-->
<!--    }-->

<!--    // Run validation on every input change-->
<!--    document.querySelectorAll("input").forEach(input => {-->
<!--        input.addEventListener("input", checkFormValidity);-->
<!--    });-->
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
