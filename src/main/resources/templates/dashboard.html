<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Task Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


    <style>
        .popup-container {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;

}

.popup-box {
  background: white;
  padding: 20px;
  border-radius: 8px;
  min-width: 300px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

    </style>
</head>
<body class="bg-light p-3 text-dark">

<div th:if="${loginSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${loginSuccess}">Signup successful!</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>



<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">Admin Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdminNav">
            <span class="navbar-toggler-icon"></span>
        </button>


            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-4 text-white"></i>
                        <span class="text-white">Profile</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>

</nav>


<!-- Main Content -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>All Tasks</h3>
<!--        <a th:href="@{/add-task}" class="btn btn-primary">+ Add Task</a>-->
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            Add New Task
        </button>

    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>Task ID</th>
                <th>Task</th>
                <th>Student Name</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over the task list and render only table rows -->
            <tr th:each="task : ${taskList}">
                <td th:text="${task.id}"></td>
                <td class="text-dark cursor-pointer"
                    data-bs-toggle="modal"
                    data-bs-target="#taskDetailModal"
                    th:attr="data-taskname=${task.taskName},
                             data-id=${task.id},
                             data-student=${task.studentName},
                             data-deadline=${task.deadline},
                             data-status=${task.status}"
                    th:text="${task.taskName}"></td>
                <td th:text="${task.studentName}"></td>
                <td th:text="${task.deadline}"></td>
                <td th:text="${task.status}"></td>
                <td>
                    <div class="btn-group">
                        <!-- Edit Button (Targeting specific modal ID) -->
                        <button class="btn btn-sm btn-warning"
                                th:attr="data-bs-target='#editTaskModal__' + ${task.id}"
                                data-bs-toggle="modal">✏️</button>

                        <!-- Delete Button (Targeting specific modal ID) -->
                        <button type="button"
                                class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#deleteModal__' + ${task.id}">
                            🗑️
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ========================================== -->
<!-- MODALS SECTION (Placed Outside the Table) -->
<!-- ========================================== -->

<!-- 1. Task Detail Modal (Single instance, populated dynamically by JS) -->
<div class="modal fade" id="taskDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Task Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p><strong>Task:</strong> <span id="modalTaskName">-</span></p>
                <p><strong>Task Id:</strong> <span id="modalTaskId">-</span></p>
                <p><strong>Student:</strong> <span id="modalStudent">-</span></p>
                <p><strong>Deadline:</strong> <span id="modalDeadline">-</span></p>
                <p><strong>Status:</strong> <span id="modalStatus">-</span></p>
            </div>
        </div>
    </div>
</div>

<!-- 2. Add Task Modal (Single instance, always available even if taskList is empty) -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addTaskModalLabel">Add New Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/add-task}" method="post" th:object="${task}" autocomplete="off">
                    <div class="mb-3">
                        <label>Task Title:</label>
                        <input type="text" class="form-control" th:field="*{taskName}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student Name:</label>
                        <select class="form-select" th:field="*{studentName}" required>
                            <option value="">Select Student</option>
                            <option th:each="n : ${names}" th:text="${n}" th:value="${n}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Deadline:</label>
                        <input type="date" class="form-control" th:field="*{deadline}" required>
                    </div>
                    <div class="mb-3">
                        <label>Status:</label>
                        <select class="form-select" th:field="*{status}" required>
                            <option value="Not Started">Not Started</option>
                            <option value="Delayed">Delayed</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Add Task</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 3. Dynamic Modals (Generated per Task in the list) -->
<th:block th:each="task : ${taskList}">
    <!-- Delete Confirmation Modal -->
    <div class="modal fade"
         th:id="'deleteModal__' + ${task.id}"
         tabindex="-1"
         th:attr="aria-labelledby='deleteModalLabel__' + ${task.id}"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" th:id="'deleteModalLabel__' + ${task.id}">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this task?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form th:action="@{'/tasks/delete/' + ${task.id}}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade"
         th:id="'editTaskModal__' + ${task.id}"
         tabindex="-1"
         th:attr="aria-labelledby='editTaskModalLabel__' + ${task.id}"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:id="'editTaskModalLabel__' + ${task.id}">Update Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{'/tasks/edit/' + ${task.id}}" method="post" th:object="${task}" autocomplete="off">
                        <div class="mb-3">
                            <label>Task Title:</label>
                            <input type="text" class="form-control" th:field="*{taskName}" required>
                        </div>
                        <div class="mb-3">
                            <label>Student Name:</label>
                            <select class="form-select" th:field="*{studentName}" required>
                                <option value="" disabled>Select Student</option>
                                <option th:each="n : ${names}" th:text="${n}" th:value="${n}" th:selected="${n == task.studentName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Deadline:</label>
                            <input type="date" class="form-control" th:field="*{deadline}" required>
                        </div>
                        <div class="mb-3">
                            <label>Status:</label>
                            <select class="form-select" th:field="*{status}" required>
                                <option value="Not Started">Not Started</option>
                                <option value="Delayed">Delayed</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Update Task</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const detailModal = document.getElementById('taskDetailModal');
    if (detailModal) {
        detailModal.addEventListener('show.bs.modal', function (event) {
            const trigger = event.relatedTarget;
            document.getElementById('modalTaskName').textContent = trigger.getAttribute('data-taskname');
            document.getElementById('modalTaskId').textContent = trigger.getAttribute('data-id');
            document.getElementById('modalStudent').textContent = trigger.getAttribute('data-student');
            document.getElementById('modalDeadline').textContent = trigger.getAttribute('data-deadline');
            document.getElementById('modalStatus').textContent = trigger.getAttribute('data-status');
        });
    }

    // Set today's date as the minimum allowed date for all date inputs
    document.addEventListener("DOMContentLoaded", function () {
        const today = new Date().toISOString().split('T')[0];
        document.querySelectorAll("input[type='date']").forEach(input => {
            input.setAttribute("min", today);
        });
    });
</script>


</body>
</html>
