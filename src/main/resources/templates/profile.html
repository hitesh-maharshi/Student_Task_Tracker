<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6bff;
            --secondary-color: #6c757d;
            --accent-color: #ff6b6b;
            --light-bg: #f8f9fa;
            --dark-text: #2c3e50;
            --light-text: #f8f9fa;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-text);
            min-height: 100vh;
            padding: 2rem;
        }

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), #6a11cb);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            margin: 0 auto 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-id {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .profile-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-section {
            background: var(--light-bg);
            border-radius: 10px;
            padding: 1.5rem;
            transition: var(--transition);
        }

        .info-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-item {
            display: flex;
            margin-bottom: 1rem;
            align-items: center;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .info-content {
            flex-grow: 1;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--secondary-color);
            margin-bottom: 0.2rem;
        }

        .info-value {
            font-weight: 500;
            word-break: break-all;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #3a5bef;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: rgba(74, 107, 255, 0.1);
            transform: translateY(-2px);
        }

        .edit-form {
            display: none;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-weight: 500;
            color: var(--secondary-color);
        }

        .form-input {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 107, 255, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .profile-body {
                padding: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <img th:src="@{/image/profile.png}"
                 alt="Profile Picture" class="profile-pic" id="profile-pic">
            <h1 class="profile-name" id="profile-name" th:text="${user.email}">Loading...</h1>
            <div class="profile-id" id="profile-id" th:text="'ID: ' + ${user.id}">ID: Loading...</div>
        </div>

        <div class="profile-body">
            <div class="info-section">
                <h2 class="section-title"><i class="fas fa-info-circle"></i> User Information</h2>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <div class="info-content">
                        <div class="info-label">User ID</div>
                        <div class="info-value" id="user-id" th:text="${user.id}">Loading...</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="info-content">
                        <div class="info-label">Username</div>
                        <div class="info-value" id="user-username" th:text="${user.name}">Loading...</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="info-content">
                        <div class="info-label">Email Address</div>
                        <div class="info-value" id="user-email" th:text="${user.email}">Loading...</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="info-content">
                        <div class="info-label">Contact Number</div>
                        <div class="info-value" id="user-contact" th:text="${user.contact ?: 'Not provided'}">Loading...</div>
                    </div>
                </div>

                <div class="edit-form" id="edit-form">
                    <div class="form-group">
                        <label for="edit-name" class="form-label">Full Name</label>
                        <input type="text" id="edit-name" class="form-input" th:value="${user.name}" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-username" class="form-label">Username</label>
                        <input type="text" id="edit-username" class="form-input" th:value="${user.name}" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-email" class="form-label">Email</label>
                        <input type="email" id="edit-email" class="form-input" th:value="${user.email}" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-contact" class="form-label">Contact Number</label>
                        <input type="tel" id="edit-contact" class="form-input" th:value="${user.contact}">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" id="save-btn">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                        <button type="button" class="btn btn-outline" id="cancel-btn">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </div>

                <div class="action-buttons">
<!--                    <button class="btn btn-primary" id="edit-btn">-->
<!--                        <i class="fas fa-edit"></i> Edit Profile-->
<!--                    </button>-->
<!--                    <button class="btn btn-outline" id="refresh-btn">-->
<!--                        <i class="fas fa-sync-alt"></i> Refresh Data-->
<!--                    </button>-->
<!--                    <a th:href="@{/studentdashboard}" ><button  class="btn btn-primary">Close</button> </a>-->
                    <a th:href="@{/reset-password}" ><button  class="btn btn-primary">Reset password</button> </a>
                    <a th:href="@{/Close}" ><button  class="btn btn-primary">Close</button> </a>
                </div>
            </div>
        </div>
    </div>
</div>
