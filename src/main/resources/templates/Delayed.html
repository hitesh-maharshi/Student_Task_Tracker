<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Task Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/student-bootstrap.css}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand text-white" th:href="@{/studentdashboard}">Student Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/studentdashboard}">Home</a></li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/Completed}">Task Completed</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/InProgress}">Task In Progress</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/NotStarted}">Task Not Started</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/Delayed}">Task Delayed</a>
                </li>
            </ul>

            <div class="ms-auto">
                <a class="btn btn-primary text-white" th:href="@{/logout}">Log out</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="bg-white p-4 rounded shadow">
        <hr />
        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">
                <caption class="caption-top text-center fw-bold text-uppercase bg-dark text-light py-2">Task Delayed</caption>
                <thead class="table-dark text-uppercase">
                <tr>
                    <th>Task ID</th>
                    <th>Student Name</th>
                    <th>Task</th>
                    <th>Deadline</th>
                    <th>Status</th>
<!--                    <th>Mark as Complete</th>-->
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${taskList}">
                    <td th:text="${task.id}"></td>
                    <td th:text="${task.studentName}"></td>
                    <td th:text="${task.taskName}"></td>
                    <td th:text="${task.deadline}"></td>
                    <td th:text="${task.status}">

                    </td>
<!--                    <td>-->
<!--                        <input type="checkbox" th:checked="${task.status == 'Completed'}"/>-->
<!--                    </td>-->
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
